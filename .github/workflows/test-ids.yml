name: IDS Regression Tests

on:
  push:
    branches: [ main, V4.0 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libpcap-dev \
            librabbitmq-dev \
            libcurl4-openssl-dev \
            libmaxminddb-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run replay tests
        run: |
          # pcaps sintéticos versionados (tests/pcaps/gen_pcaps.py) — sem eles o CI falha.
          ls tests/pcaps/*.pcap
          ./build/NetworkTrafficAnalyzer \
            --replay-dir tests/pcaps/ \
            --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ids-test-report
          path: tests/report.json
          if-no-files-found: ignore

  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build nta-server image
        run: docker build -f deploy/nta-server.Dockerfile -t nta-server:ci .

      - name: Smoke — sobe sem broker e reporta degraded (503)
        run: |
          docker run -d --name nta nta-server:ci
          for i in $(seq 1 20); do
            code=$(docker exec nta curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/health || true)
            [ "$code" = 503 ] && { echo "health 503 (esperado sem broker)"; exit 0; }
            sleep 1
          done
          docker logs nta; exit 1

  # Build nativo do agente no Windows (MSYS2 UCRT64 + Npcap SDK), com link.
  # O runner não tem o driver Npcap (instalador free não é silencioso), então
  # o replay roda só no Linux; aqui validamos compilação + link do .exe.
  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            curl unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-rabbitmq-c

      - name: Npcap SDK
        run: |
          curl -sSLo /tmp/npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.16.zip
          unzip -q /tmp/npcap-sdk.zip -d /tmp/npcap-sdk

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNPCAP_SDK_DIR="$(cygpath -m /tmp/npcap-sdk)"
          cmake --build build
          ls -la build/NetworkTrafficAnalyzer.exe

      - name: .exe autocontido (sem DLLs do MSYS2 — exigido pelo Windows Service)
        run: |
          ldd build/NetworkTrafficAnalyzer.exe
          if ldd build/NetworkTrafficAnalyzer.exe | grep -i '/ucrt64/'; then
            echo "::error::.exe depende de DLLs do MSYS2"; exit 1
          fi
