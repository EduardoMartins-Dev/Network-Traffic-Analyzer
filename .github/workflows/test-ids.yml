name: IDS Regression Tests

on:
  push:
    branches: [ main, V4.0 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libpcap-dev \
            librabbitmq-dev \
            libcurl4-openssl-dev \
            libmaxminddb-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run replay tests
        run: |
          # pcaps sintéticos versionados (tests/pcaps/gen_pcaps.py) — sem eles o CI falha.
          ls tests/pcaps/*.pcap
          ./build/NetworkTrafficAnalyzer \
            --replay-dir tests/pcaps/ \
            --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ids-test-report
          path: tests/report.json
          if-no-files-found: ignore

  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build nta-server image
        run: docker build -f deploy/nta-server.Dockerfile -t nta-server:ci .

      - name: Smoke — sobe sem broker e reporta degraded (503)
        run: |
          docker run -d --name nta nta-server:ci
          for i in $(seq 1 20); do
            code=$(docker exec nta curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/health || true)
            [ "$code" = 503 ] && { echo "health 503 (esperado sem broker)"; exit 0; }
            sleep 1
          done
          docker logs nta; exit 1

  # Compila (sem link) as fontes do agente para Windows com MinGW-w64.
  # Guarda a portabilidade até o job nativo (MSYS2 + Npcap) substituir este.
  agent-windows-cross:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain MinGW-w64 + Npcap SDK + headers rabbitmq-c
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix cmake unzip
          curl -sSLo /tmp/npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.16.zip
          unzip -q /tmp/npcap-sdk.zip -d /tmp/npcap-sdk
          git clone -q --depth 1 --branch v0.18.0 https://github.com/alanxz/rabbitmq-c.git /tmp/rabbitmq-c
          # só configura: gera rabbitmq-c/export.h
          cmake -S /tmp/rabbitmq-c -B /tmp/rmq-build -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix -DENABLE_SSL_SUPPORT=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DBUILD_TOOLS=OFF

      - name: Compilar fontes do agente (x86_64-w64-mingw32)
        run: |
          for f in src/main.c src/capture/capture.c src/analysis/analyzer.c \
                   src/analysis/collector.c src/output/publisher.c src/output/cJSON.c \
                   src/replay/replay.c src/core/ringbuf.c src/core/pipeline.c \
                   src/platform/netif_win32.c; do
            echo "== $f"
            x86_64-w64-mingw32-gcc-posix -std=gnu11 -Wall -Wextra -Werror=implicit-function-declaration \
              -D_WIN32_WINNT=0x0601 -Iinclude -I/tmp/npcap-sdk/Include \
              -I/tmp/rabbitmq-c/include -I/tmp/rmq-build/include \
              -c "$f" -o /dev/null
          done
