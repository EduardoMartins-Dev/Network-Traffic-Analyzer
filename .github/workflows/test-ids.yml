name: IDS Regression Tests

on:
  push:
    branches: [ main, V4.0 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libpcap-dev \
            librabbitmq-dev \
            libcurl4-openssl-dev \
            libmaxminddb-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run replay tests
        run: |
          # pcaps sintéticos versionados (tests/pcaps/gen_pcaps.py) — sem eles o CI falha.
          ls tests/pcaps/*.pcap
          ./build/NetworkTrafficAnalyzer \
            --replay-dir tests/pcaps/ \
            --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ids-test-report
          path: tests/report.json
          if-no-files-found: ignore
