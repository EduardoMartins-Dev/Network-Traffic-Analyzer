name: IDS Regression Tests

on:
  push:
    branches: [ main, V4.0 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
            libpcap-dev \
            librabbitmq-dev \
            libcurl4-openssl-dev \
            libmaxminddb-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run replay tests
        run: |
          # pcaps sintéticos versionados (tests/pcaps/gen_pcaps.py) — sem eles o CI falha.
          ls tests/pcaps/*.pcap
          ./build/NetworkTrafficAnalyzer \
            --replay-dir tests/pcaps/ \
            --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ids-test-report
          path: tests/report.json
          if-no-files-found: ignore

  # ASan + UBSan: qualquer acesso inválido ou comportamento indefinido
  # (ex.: parsing de pacote malformado) reprova o PR.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential pkg-config libpcap-dev \
            librabbitmq-dev libcurl4-openssl-dev libmaxminddb-dev

      - name: Build (ASan + UBSan)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build --parallel

      - name: Unit tests + replay sob sanitizers
        run: |
          ctest --test-dir build --output-on-failure
          ./build/NetworkTrafficAnalyzer --replay-dir tests/pcaps/

  # ThreadSanitizer no NtaIocStore (B31): leitores x recarga. NÃO bloqueante
  # (continue-on-error): um relatório do TSan aparece como falha deste job, sem
  # reprovar o PR. Só o test_ioc, sem nta-server (sem libcurl/libmaxminddb).
  tsan-ioc:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential

      - name: Build test_ioc (ThreadSanitizer)
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DNTA_BUILD_SERVER=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          cmake --build build-tsan --target test_ioc --parallel

      - name: Run test_ioc under TSan
        run: ctest --test-dir build-tsan -R '^test_ioc$' --output-on-failure

  # Fuzzing do parser (B06): libFuzzer + ASan/UBSan sobre frames Ethernet, com
  # corpus inicial de tests/pcaps. Smoke curto e NÃO bloqueante (continue-on-error):
  # um crash aparece como falha do job e o caso fica em artefato, para virar
  # issue/PR separado. Não corrigir o analyzer neste job.
  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (clang + libFuzzer)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake clang pkg-config libpcap-dev
          CLANG_VER=$(clang --version | grep -oE '[0-9]+' | head -1)
          sudo apt-get install -y "libclang-rt-${CLANG_VER}-dev"
          cat > /tmp/fuzz-probe.c <<'EOF'
          #include <stddef.h>
          #include <stdint.h>
          int LLVMFuzzerTestOneInput(const uint8_t *d, size_t n) { (void)d; (void)n; return 0; }
          EOF
          clang -fsanitize=fuzzer,address,undefined /tmp/fuzz-probe.c -o /tmp/fuzz-probe
          echo "libFuzzer disponível (clang ${CLANG_VER})"

      - name: Build harness (libFuzzer + ASan + UBSan)
        run: |
          cmake -S tests/fuzz -B build-fuzz -DCMAKE_C_COMPILER=clang
          cmake --build build-fuzz --target fuzz_parser fuzz_rules fuzz_eve --parallel

      - name: Corpus inicial (frames dos pcaps)
        run: python3 tests/fuzz/make_corpus.py tests/pcaps build-fuzz/corpus

      - name: Fuzz smoke (120 s)
        run: |
          mkdir -p build-fuzz/artifacts
          ./build-fuzz/fuzz_parser build-fuzz/corpus \
            -max_total_time=120 -max_len=4096 -timeout=10 \
            -artifact_prefix=build-fuzz/artifacts/

      # Carregador de limiares (rules, B18) e parser EVE (eve, B17): 25 s cada,
      # mesmo esquema. `if: always()` para rodarem mesmo se o fuzz_parser cair.
      - name: Corpus semente (rules e eve)
        if: always()
        run: |
          mkdir -p build-fuzz/corpus-rules build-fuzz/corpus-eve build-fuzz/artifacts
          cp deploy/rules/*.json build-fuzz/corpus-rules/
          cp tests/eve/eve-sample.json build-fuzz/corpus-eve/

      - name: Fuzz rules (25 s)
        if: always()
        run: |
          ./build-fuzz/fuzz_rules build-fuzz/corpus-rules \
            -max_total_time=25 -max_len=16384 -timeout=10 \
            -artifact_prefix=build-fuzz/artifacts/rules-

      - name: Fuzz eve (25 s)
        if: always()
        run: |
          ./build-fuzz/fuzz_eve build-fuzz/corpus-eve \
            -max_total_time=25 -max_len=16384 -timeout=10 \
            -artifact_prefix=build-fuzz/artifacts/eve-

      - name: Upload crashes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-parser-artifacts
          path: build-fuzz/artifacts/
          if-no-files-found: ignore

  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build nta-server image
        run: docker build -f deploy/nta-server.Dockerfile -t nta-server:ci .

      - name: Smoke — sobe sem broker e reporta degraded (503)
        run: |
          docker run -d --name nta nta-server:ci
          for i in $(seq 1 20); do
            code=$(docker exec nta curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9091/health || true)
            [ "$code" = 503 ] && { echo "health 503 (esperado sem broker)"; exit 0; }
            sleep 1
          done
          docker logs nta; exit 1

  # Build nativo do agente no Windows (MSYS2 UCRT64 + Npcap SDK), com link.
  # O runner não tem o driver Npcap (instalador free não é silencioso), então
  # o replay roda só no Linux; aqui validamos compilação + link do .exe.
  agent-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            curl unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-rabbitmq-c

      - name: Npcap SDK
        run: |
          curl -sSLo /tmp/npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.16.zip
          unzip -q /tmp/npcap-sdk.zip -d /tmp/npcap-sdk

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNPCAP_SDK_DIR="$(cygpath -m /tmp/npcap-sdk)"
          cmake --build build
          ls -la build/NetworkTrafficAnalyzer.exe

      - name: .exe autocontido (sem DLLs do MSYS2 — exigido pelo Windows Service)
        run: |
          ldd build/NetworkTrafficAnalyzer.exe
          if ldd build/NetworkTrafficAnalyzer.exe | grep -i '/ucrt64/'; then
            echo "::error::.exe depende de DLLs do MSYS2"; exit 1
          fi

      - name: Unit tests (execução nativa no Windows)
        run: ctest --test-dir build --output-on-failure

      - name: Instalador compila (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0-ci installer\nta-agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Agente nativo no macOS (B15): build + ctest + replay com o mesmo limiar de
  # 80 % do Linux (o replay sai com 1 abaixo disso). Sem nta-server: é Linux.
  # libpcap e librabbitmq vêm do Homebrew (keg-only), por isso os caminhos
  # entram por flags do CMake, sem mudar o CMakeLists.txt.
  agent-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install libpcap rabbitmq-c

      - name: Configure CMake
        run: |
          PCAP="$(brew --prefix libpcap)"
          RMQ="$(brew --prefix rabbitmq-c)"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNTA_BUILD_SERVER=OFF \
            -DCMAKE_C_FLAGS="-I$PCAP/include -I$RMQ/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PCAP/lib -L$RMQ/lib"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run replay tests
        run: |
          ./build/NetworkTrafficAnalyzer \
            --replay-dir tests/pcaps/ \
            --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ids-test-report-macos
          path: tests/report.json
          if-no-files-found: ignore

  # Agente nativo no FreeBSD (B15): VM QEMU no runner Linux, via
  # cross-platform-actions/action FIXADO no SHA do tag v1.7.0 (publicado em
  # 2026-10-25; a v1.8.0 saiu um dia antes desta revisão). FreeBSD 14.5 é a
  # série estável com pacotes binários. Job lento (emulação): timeout curto.
  # Bloqueante. Até o PR #44 era continue-on-error por dois bugs de
  # portabilidade, corrigidos nele: link_directories(/usr/local/lib) vinha
  # depois do add_executable (CMakeLists.txt) e src/server/nta_ioc.c não
  # incluía <sys/socket.h>. Passou no CI do PR #44 (build, ctest 8/8, replay
  # 26/26).
  agent-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: freebsd
          version: '14.5'
          memory: 4G
          cpu_count: 2

      - name: Install dependencies (pkg)
        run: sudo pkg install -y cmake libpcap rabbitmq-c

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNTA_BUILD_SERVER=OFF

      - name: Build
        # Sem gerador Ninja, o CMake usa o make do BSD, que não aceita -j sem
        # número (--parallel vazio). Passa o número de CPUs explicitamente.
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run replay tests
        run: ./build/NetworkTrafficAnalyzer --replay-dir tests/pcaps/ --report tests/report.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ids-test-report-freebsd
          path: tests/report.json
          if-no-files-found: ignore
