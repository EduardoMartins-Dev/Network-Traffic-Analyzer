# Contact points: onde os alertas do Grafana são entregues.
# Token e chat_id vêm do ambiente (docker-compose .env).
# Docs: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-nta
    receivers:
      - uid: telegram-nta-receiver
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: "8326750174"
          parse_mode: HTML
          message: |
            🚨 <b>{{ .CommonLabels.alertname }}</b>
            Severidade: <b>{{ .CommonLabels.severity }}</b>
            Resumo: {{ .CommonAnnotations.summary }}

            {{ range .Alerts }}<pre>{{ .ValueString }}</pre>
            {{ end }}
